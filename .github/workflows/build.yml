# Gera TagStock-Servidor.exe (Windows) e TagStock.apk (Zebra MC3300R) e publica em Releases.
name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  servidor-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Testes
        run: |
          pip install -r requirements-dev.txt
          pytest -q
      - name: Gerar TagStock-Servidor.exe
        run: |
          pip install pyinstaller
          pyinstaller --onefile --name TagStock-Servidor --icon icone.ico --add-data "app/static;app/static" --collect-submodules uvicorn tagstock_servidor.py
      - uses: actions/upload-artifact@v4
        with:
          name: TagStock-Servidor
          path: server/dist/TagStock-Servidor.exe

  coletor-android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: coletor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Baixar SDK RFID da Zebra (API3)
        run: >
          curl -fsSL -o app/libs/API3_LIB-release.aar
          https://raw.githubusercontent.com/ZebraDevs/RFID-Android-Inventory-Sample/master/RFIDAPI3Library/API3_LIB-release-2.0.2.82.aar
      - name: Gerar APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk TagStock.apk
      - uses: actions/upload-artifact@v4
        with:
          name: TagStock
          path: coletor/TagStock.apk

  publicar:
    needs: [servidor-windows, coletor-android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: TagStock v1.${{ github.run_number }}
          make_latest: true
          files: |
            TagStock-Servidor.exe
            TagStock.apk
