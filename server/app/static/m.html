<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, interactive-widget=resizes-content">
<meta name="theme-color" content="#0f2236">
<meta name="color-scheme" content="light dark">
<title>TagStock Coletor</title>
<link rel="icon" href="/static/icone.svg">
<!--
  Tela do coletor TagStock (Zebra MC3300R / MC3390R), aberta dentro do app TagStock (WebView).
  - RFID: o app lê pelo SDK Zebra e chama leituraRfid(epc) aqui.
  - Código de barras: o DataWedge "digita" o código no campo invisível #leitura.
  - A página fala com o app pelo objeto ColetorApp (gatilho, potência, gravar, localizar...).
  Toda regra fica no servidor; esta tela só lê, mostra e confirma.
-->
<style>
  :root {
    --bg: #eef2f6; --painel: #fff; --borda: #d8dee6; --texto: #17202b; --texto-2: #5c6778;
    --topo: #0f2236; --primaria: #0b7a75; --perigo: #c62828; --sucesso: #2e7d32; --alerta: #b26a00;
    --fundo-perigo: #fdecea; --fundo-sucesso: #e8f5e9; --fundo-alerta: #fff4e0; --fundo-info: #e3f3f2;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0f1520; --painel: #172130; --borda: #2a3748; --texto: #e4eaf2; --texto-2: #9aa8ba; --topo: #0a1520;
            --primaria: #26a69a; --perigo: #ef5350; --sucesso: #66bb6a; --alerta: #ffb74d;
            --fundo-perigo: #3a1d1f; --fundo-sucesso: #1b3320; --fundo-alerta: #3a2c14; --fundo-info: #123433; }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overscroll-behavior: none; }
  body { -webkit-user-select: none; user-select: none; background: var(--bg); color: var(--texto);
         font: 15px/1.35 Roboto, "Segoe UI", system-ui, Arial, sans-serif; display: flex; flex-direction: column; max-width: 560px; margin: 0 auto; }
  input, textarea { -webkit-user-select: text; user-select: text; }
  header { background: var(--topo); color: #fff; display: flex; align-items: center; gap: 4px; padding: 0 4px 0 8px; min-height: 50px; flex: none; }
  header h1 { font-size: 15px; line-height: 1.15; margin: 0; flex: 1; min-width: 0; font-weight: 600; }
  header button { background: none; border: none; color: #fff; font-size: 20px; width: 38px; height: 42px; border-radius: 8px; flex: none; padding: 0; }
  header button:active { background: #ffffff22; }
  header #modo.barras { background: #ffb74d33; }
  header #modo.lendo { background: var(--primaria); animation: pulsa .6s infinite alternate; }
  header #teclado.ligado { background: var(--primaria); }
  @keyframes pulsa { to { opacity: .55; } }
  .captura { position: fixed; top: 0; left: 0; width: 1px; height: 1px; opacity: 0; border: 0; padding: 0; resize: none; overflow: hidden; }
  main { flex: 1; overflow-y: auto; padding: 8px 8px 16px; }
  .grade-menu { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 7px; }
  .tile { text-decoration: none; background: var(--painel); border: 1px solid var(--borda); border-radius: 12px; min-height: 84px; display: flex; flex-direction: column; align-items: center;
          justify-content: center; gap: 5px; font-weight: 600; font-size: 13px; color: var(--texto); padding: 6px; text-align: center; line-height: 1.15; }
  .tile:active { background: var(--fundo-info); }
  .tile .ic { font-size: 26px; line-height: 1; }
  .secao { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--texto-2); margin: 12px 2px 6px; font-weight: 700; }
  .card { background: var(--painel); border: 1px solid var(--borda); border-radius: 10px; padding: 10px; margin-bottom: 8px; }
  .card h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--texto-2); margin: 0 0 6px; display: flex; align-items: center; gap: 6px; }
  .card h2 .dir { margin-left: auto; text-transform: none; letter-spacing: 0; }
  .dica { color: var(--texto-2); text-align: center; padding: 14px 8px; border: 2px dashed var(--borda); border-radius: 10px; font-size: 14px; }
  .dica b { color: var(--texto); }
  .produto { font-size: 16px; font-weight: 700; }
  .fraco { color: var(--texto-2); font-size: 13px; font-weight: 400; }
  .mono { font-family: Consolas, monospace; font-size: 12.5px; word-break: break-all; }
  label.campo { display: block; margin-bottom: 8px; }
  label.campo > span { display: block; font-size: 12px; font-weight: 600; color: var(--texto-2); margin-bottom: 3px; }
  input, select { width: 100%; font: 16px Roboto, "Segoe UI", Arial, sans-serif; padding: 9px 10px; border: 1px solid var(--borda); border-radius: 8px; background: var(--painel); color: var(--texto); min-width: 0; }
  input:focus, select:focus { outline: 2px solid var(--primaria); outline-offset: -1px; }
  input[type=checkbox] { width: auto; }
  .duas { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .botoes { display: flex; gap: 8px; margin-top: 4px; }
  .botoes > * { flex: 1; }
  button.b { font: 700 15px Roboto, "Segoe UI", Arial, sans-serif; min-height: 50px; border-radius: 10px; border: 1px solid var(--borda); background: var(--painel); color: var(--texto); padding: 6px 10px; }
  button.b:active { filter: brightness(.92); }
  button.b:disabled { opacity: .45; }
  button.primario { background: var(--primaria); border-color: var(--primaria); color: #fff; }
  button.perigo { background: var(--perigo); border-color: var(--perigo); color: #fff; }
  button.sucesso { background: var(--sucesso); border-color: var(--sucesso); color: #fff; }
  button.link { background: none; border: none; color: var(--primaria); font: 600 14px inherit; padding: 4px; }
  .lista { list-style: none; margin: 0; padding: 0; }
  .lista li { display: flex; align-items: center; gap: 8px; padding: 8px 2px; border-bottom: 1px solid var(--borda); }
  .lista li:last-child { border-bottom: none; }
  .lista li .info { flex: 1; min-width: 0; }
  .lista li .qtd { font-weight: 700; font-size: 16px; white-space: nowrap; }
  .lista li.ok { background: var(--fundo-sucesso); }
  .lista li.erro .info { color: var(--perigo); }
  .lista li.clicavel:active { background: var(--fundo-info); }
  .x { border: none; background: none; color: var(--texto-2); font-size: 20px; width: 34px; height: 34px; flex: none; }
  .contador { font-size: 26px; font-weight: 800; }
  .numeros { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; text-align: center; }
  .numeros div { background: var(--bg); border-radius: 8px; padding: 6px 2px; }
  .numeros b { display: block; font-size: 22px; }
  .numeros span { font-size: 11.5px; color: var(--texto-2); }
  .progresso { height: 7px; border-radius: 4px; background: var(--bg); overflow: hidden; margin-top: 4px; }
  .progresso > span { display: block; height: 100%; background: var(--primaria); }
  .progresso.completo > span { background: var(--sucesso); }
  .radar { height: 46px; border-radius: 23px; background: var(--bg); border: 1px solid var(--borda); overflow: hidden; margin: 14px 0 8px; }
  .radar-barra { height: 100%; width: 0; background: hsl(220, 85%, 50%); transition: width .15s, background .15s; }
  .selo { display: inline-block; padding: 0 7px; border-radius: 9px; font-size: 11.5px; font-weight: 700; background: var(--bg); color: var(--texto-2); white-space: nowrap; }
  .selo.perigo { background: var(--fundo-perigo); color: var(--perigo); } .selo.alerta { background: var(--fundo-alerta); color: var(--alerta); }
  .selo.sucesso { background: var(--fundo-sucesso); color: var(--sucesso); } .selo.info { background: var(--fundo-info); color: var(--primaria); }
  .vazio { color: var(--texto-2); text-align: center; padding: 10px; font-size: 14px; justify-content: center; }
  .alarme { background: var(--perigo); color: #fff; border-radius: 10px; padding: 16px; text-align: center; font-size: 20px; font-weight: 800; animation: pisca .4s infinite alternate; }
  @keyframes pisca { to { opacity: .6; } }
  dialog { border: none; border-radius: 12px; padding: 16px; width: min(340px, calc(100vw - 24px)); background: var(--painel); color: var(--texto); box-shadow: 0 16px 40px #0007; }
  dialog::backdrop { background: rgba(0,0,0,.5); }
  dialog h3 { margin: 0 0 10px; font-size: 17px; }
  dialog .botoes { margin-top: 12px; }
  dialog[open] { margin: 70px auto auto; }
  dialog.pin { background: #fff; color: #17202b; border-radius: 6px; padding: 10px 14px 2px; width: min(280px, 86vw); }
  dialog.pin h3 { font-size: 16px; font-weight: 500; margin: 0 0 2px; }
  dialog.pin .pin-visor { text-align: center; font-size: 20px; letter-spacing: 8px; min-height: 24px; line-height: 24px; }
  dialog.pin .pin-teclado { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px 10px; margin: 4px 4px 0; }
  dialog.pin .pin-teclado button { height: 36px; border: 0; border-radius: 4px; background: #d6d8da; color: #17202b; font-size: 18px; box-shadow: 0 1px 2px #0003; }
  dialog.pin .pin-teclado button.ok { background: #0b7a75; color: #fff; border-radius: 8px; }
  dialog.pin .pin-rodape { text-align: right; }
  dialog.pin .pin-rodape button { background: none; border: 0; color: #00897b; font-size: 14px; font-weight: 600; padding: 6px; }
  #tecladoTela { position: fixed; left: 0; right: 0; bottom: 0; z-index: 50; background: #1b2230; padding: 4px 3px 6px; box-shadow: 0 -4px 14px #0006; touch-action: manipulation; }
  #tecladoTela[hidden] { display: none; }
  #tecladoTela .linha { display: flex; gap: 3px; margin-top: 3px; }
  #tecladoTela button { flex: 1; min-width: 0; height: 44px; border: 0; border-radius: 6px; background: #3a4458; color: #fff; font: 600 18px system-ui, sans-serif; padding: 0; }
  #tecladoTela button:active { background: #5b6b8a; }
  #tecladoTela button.esp { background: #283144; font-size: 15px; }
  #tecladoTela button.ok { background: var(--primaria); }
  #tecladoTela.numerico button { height: 52px; font-size: 22px; }
  body.com-teclado main { padding-bottom: 250px; }
  #rodape { flex: none; text-align: center; font-size: 12px; color: var(--texto-2); padding: 4px 8px; border-top: 1px solid var(--borda); }
  #msg { flex: none; padding: 10px 12px; font-size: 15px; font-weight: 600; white-space: pre-line; display: none; border-top: 3px solid; max-height: 35vh; overflow-y: auto; }
  #msg.ok { display: block; background: var(--fundo-sucesso); border-color: var(--sucesso); }
  #msg.erro { display: block; background: var(--fundo-perigo); border-color: var(--perigo); }
  #msg.alerta { display: block; background: var(--fundo-alerta); border-color: var(--alerta); }
  #msg.info { display: block; background: var(--fundo-info); border-color: var(--primaria); }
  .login { padding: 24px 12px; }
  .login .logo { text-align: center; margin: 10px 0 18px; }
  .login .logo b { display: block; font-size: 24px; margin-top: 6px; }
</style>
</head>
<body>
<header>
  <button id="voltar" aria-label="Voltar" style="display:none;width:28px">←</button>
  <h1 id="titulo">TagStock</h1>
  <button id="modo" title="O gatilho lê RFID ou código de barras (toque para trocar)" hidden>📡</button>
  <button id="teclado" title="Teclado">⌨</button>
  <button id="btConfig" title="Config">⚙</button>
  <button id="btSair" title="Sair do app" hidden><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" style="display:block;margin:auto"><path d="M12 3v9"/><path d="M6.3 6.8a8 8 0 1 0 11.4 0"/></svg></button>
</header>
<textarea id="leitura" class="captura" rows="1" inputmode="none" autocomplete="off" autocapitalize="characters" spellcheck="false" tabindex="-1" aria-hidden="true"></textarea>
<main id="tela"></main>
<div id="msg" role="status"></div>
<footer id="rodape"></footer>
<div id="tecladoTela" hidden></div>

<dialog id="dlgDigitar"><form method="dialog" id="formDigitar">
  <h3>Digitar código</h3>
  <input id="edDigitar" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="Código de barras, SKU ou EPC">
  <div class="botoes"><button class="b" type="button" id="digCancelar">Cancelar</button><button class="b primario" type="submit">OK</button></div>
</form></dialog>

<dialog id="dlgSenha" class="pin">
  <h3>PIN do administrador</h3>
  <div class="pin-visor" id="pinVisor">—</div>
  <div class="pin-teclado" id="pinTeclado">
    <button type="button">1</button><button type="button">2</button><button type="button">3</button>
    <button type="button">4</button><button type="button">5</button><button type="button">6</button>
    <button type="button">7</button><button type="button">8</button><button type="button">9</button>
    <button type="button" data-t="apagar">⌫</button><button type="button">0</button><button type="button" data-t="ok" class="ok">OK</button>
  </div>
  <div class="pin-rodape"><button type="button" id="senhaCancelar">CANCELAR</button></div>
</dialog>

<dialog id="dlgConfirmar"><h3 id="cfTitulo"></h3><div id="cfTexto"></div>
  <div class="botoes"><button class="b" id="cfNao">Cancelar</button><button class="b primario" id="cfSim">Confirmar</button></div></dialog>

<script>
"use strict";
// ======================================================================= utilidades
const $ = (id) => document.getElementById(id);
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const num = (v) => Number(v ?? 0).toLocaleString("pt-BR");
const dataBR = (d) => (d ? d.slice(8, 10) + "/" + d.slice(5, 7) + " " + d.slice(11, 16) : "-");
const variante = (t) => [t.cor, t.tamanho].filter(Boolean).join(" / ");
// Etiqueta NFC (NTAG): o app entrega "4E4643" + UID. Na tela aparece "NFC" e o UID.
const PREFIXO_NFC = "4E4643";
const ehNfc = (e) => String(e || "").startsWith(PREFIXO_NFC);
const uidNfc = (e) => { const u = String(e).slice(PREFIXO_NFC.length).replace(/^0+/, ""); return u.length % 2 ? "0" + u : u; };
const mostraEpc = (e) => ehNfc(e) ? `<span class="selo info">NFC</span> ${esc(uidNfc(e))}` : esc(e);
const nfcInfo = new Map();   // id -> {uid, modelo, tecnologias} (vem do app a cada leitura)
window.detalheNfc = (json) => { try { const d = JSON.parse(json); nfcInfo.set(d.id, d); } catch {} };
const app = (() => { try { return window.ColetorApp || null; } catch { return null; } })();
const LOCAL = location.protocol === "file:";          // tela de dentro do APK: sem servidor
const TELAS_LOCAIS = ["menu", "ler", "gravarLivre", "config"];

const cfg = { volume: 100, potLeitura: 100, potBaixa: 60, potLocalizar: 100, potGravar: 30, potInventario: 100, teclado: false };
try { Object.assign(cfg, JSON.parse(localStorage.getItem("tagstock.cfg") || "{}")); } catch {}
function salvarCfg() { try { localStorage.setItem("tagstock.cfg", JSON.stringify(cfg)); } catch {} }
let token = null, usuario = null;
try { token = localStorage.getItem("tagstock.token"); usuario = JSON.parse(localStorage.getItem("tagstock.usuario") || "null"); } catch {}
let idColetor = null;
try { idColetor = app?.dispositivo?.() || localStorage.getItem("tagstock.id"); } catch {}
if (!idColetor) { idColetor = "COL-" + Math.random().toString(36).slice(2, 8).toUpperCase(); try { localStorage.setItem("tagstock.id", idColetor); } catch {} }

async function api(metodo, url, corpo) {
  let r;
  try {
    r = await fetch(url, { method: metodo, headers: { "Content-Type": "application/json", "X-Token": token || "", "X-Origem": "COLETOR", "X-Dispositivo": idColetor },
                           body: corpo ? JSON.stringify(corpo) : undefined });
  } catch { throw new Error("Sem conexão com o servidor. Confira o Wi-Fi."); }
  if (r.status === 401) { sair(false); throw new Error("Faça o login"); }
  const dados = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(typeof dados.detail === "string" ? dados.detail : "Erro no servidor");
  return dados;
}

// ---- retorno para o operador: mensagem, bipe e vibração
let audio;
const ganho = () => (app?.volume ? 1 : cfg.volume / 100);
function bipe(tipo) {
  // No app: bipe nativo do Android (toca sempre). No navegador: som da página.
  if (app?.bipe) {
    try { app.bipe(tipo || "ok"); } catch {}
    if ((tipo === "erro" || tipo === "sirene") && navigator.vibrate) navigator.vibrate([150, 60, 150]);
    return;
  }
  try {
    audio = audio || new AudioContext();
    const tons = tipo === "erro" ? [[330, 0], [260, 0.16]] : tipo === "alerta" ? [[880, 0], [880, 0.14]] : tipo === "sirene" ? [[1400, 0], [900, 0.15], [1400, 0.3], [900, 0.45]] : [[1800, 0]];
    tons.forEach(([f, atraso]) => {
      const o = audio.createOscillator(), v = audio.createGain();
      o.type = "square"; o.frequency.value = f; v.gain.value = ganho();
      o.connect(v).connect(audio.destination);
      o.start(audio.currentTime + atraso); o.stop(audio.currentTime + atraso + 0.12);
    });
  } catch {}
  if ((tipo === "erro" || tipo === "sirene") && navigator.vibrate) navigator.vibrate([150, 60, 150]);
}
let timerMsg;
function msg(texto, tipo = "ok", som = true) {
  const m = $("msg");
  m.className = texto ? tipo : "";
  m.textContent = texto || "";
  if (texto && som) bipe(tipo);
  clearTimeout(timerMsg);
  if (texto) timerMsg = setTimeout(() => (m.className = ""), tipo === "erro" ? 5000 : 3000);
}
async function executar(botao, acao) {
  if (botao) botao.disabled = true;
  try { return await acao(); } catch (e) { msg(e.message, "erro"); } finally { if (botao) botao.disabled = false; }
}
function confirmar(titulo, html) {
  return new Promise((ok) => {
    $("cfTitulo").textContent = titulo; $("cfTexto").innerHTML = html;
    const fim = (v) => { $("dlgConfirmar").close(); ok(v); };
    $("cfSim").onclick = () => fim(true); $("cfNao").onclick = () => fim(false);
    $("dlgConfirmar").showModal();
  });
}
const barra = (feito, total) => `<div class="progresso ${feito >= total && total ? "completo" : ""}"><span style="width:${total ? Math.min(100, 100 * feito / total) : 0}%"></span></div>`;
const seloSit = (s) => ({ ESTOQUE: '<span class="selo sucesso">em estoque</span>', EMITIDA: '<span class="selo info">emitida</span>',
  BAIXADA: '<span class="selo perigo">baixada</span>', CANCELADA: '<span class="selo perigo">cancelada</span>' }[s] || '<span class="selo alerta">não cadastrada</span>');
const nomeProduto = (t) => t.sku ? `<b>${esc(t.sku)}</b> ${esc(variante(t))}<div class="fraco">${esc(t.descricao)}</div>`
  : t.sugerido ? `<span class="fraco">GTIN do EPC: ${esc(t.sugerido.sku)}</span>` : '<span class="fraco">etiqueta não cadastrada</span>';

// ======================================================================= app (Android): gatilho, potência, RFID
let modoGatilho = "rfid", potenciaAtual = 100;
function definirGatilho(modo) {
  modoGatilho = modo;
  if (!app) return;
  try { app.gatilhoRfid(modo === "rfid"); } catch {}
  $("modo").textContent = modo === "rfid" ? "📡" : "▮▮";
  $("modo").className = modo;
}
function definirPotencia(pct) { potenciaAtual = pct; try { app?.potencia(pct); } catch {} }
if (app) {
  $("modo").hidden = false;
  $("modo").addEventListener("click", (ev) => { ev.stopPropagation(); definirGatilho(modoGatilho === "rfid" ? "barras" : "rfid");
    msg(modoGatilho === "rfid" ? "Gatilho lê etiquetas RFID" : "Gatilho lê código de barras", "info", false); });
}
window.gatilhoRfidEvento = (apertado) => { $("modo").classList.toggle("lendo", apertado === "1"); };
window.fimLeituraRfid = (n) => { if (Number(n) === 0 && telas[telaAtual].rfid) msg("O leitor não viu nenhuma etiqueta. Aproxime e segure o gatilho.", "alerta"); };
window.leituraRfid = (epc) => {
  const dado = String(epc).trim().toUpperCase();
  if (!dado) return;
  const t = telas[telaAtual];
  if (t.rfid) t.rfid(dado);
};
let statusRfidTexto = "";
window.statusRfid = (texto) => {
  statusRfidTexto = texto;
  const ok = !/indispon|erro|não /i.test(texto);
  if (!ok || telaAtual === "menu") msg(texto, ok ? "info" : "erro", !ok);
  if (ok) { definirGatilho(modoGatilho); definirPotencia(potenciaAtual); }
};

// Juntador: as leituras chegam uma a uma; a tela recebe em lotes (a cada 300 ms), sem repetir
function juntador(aoLote, ms = 300) {
  const j = { vistas: new Set(), fila: [], timer: null,
    add(epc) { if (this.vistas.has(epc)) return; this.vistas.add(epc); this.fila.push(epc); if (!this.timer) this.timer = setTimeout(() => this.soltar(), ms); },
    soltar() { this.timer = null; const l = this.fila.splice(0); if (l.length) aoLote(l); },
    esquecer(epc) { epc ? this.vistas.delete(epc) : this.vistas.clear(); } };
  return j;
}

// ======================================================================= captura do DataWedge (código de barras)
const leitura = $("leitura");
const ehEpc = (v) => /^[0-9A-F]{16,}$/i.test(v) && !/^\d{8,14}$/.test(v);
const ehEditavel = (el) => el && el.matches && el.matches("input:not([type=checkbox]):not([type=radio]):not([type=range]), textarea") && el !== leitura;
function processarLeitura(bruto) {
  const dado = String(bruto).trim().toUpperCase();
  if (!dado) return;

}
const PAUSA = 100, RAPIDO = 50;
let rajadaL = { n: 0, bloco: false, ultimo: 0 }, timerL;
function finalizarLeitura() { clearTimeout(timerL); const v = leitura.value; leitura.value = ""; rajadaL = { n: 0, bloco: false, ultimo: 0 }; v.split(/\r?\n/).forEach(processarLeitura); }
leitura.addEventListener("input", (ev) => {
  if (leitura.value.includes("\n")) { const p = leitura.value.split(/\r?\n/); leitura.value = p.pop(); p.forEach(processarLeitura); if (!leitura.value) return; }
  const agora = performance.now();
  if (agora - rajadaL.ultimo > RAPIDO) rajadaL = { n: 0, bloco: false, ultimo: 0 };
  rajadaL.n++; rajadaL.bloco ||= (ev.data || "").length >= 4; rajadaL.ultimo = agora;
  clearTimeout(timerL);
  timerL = setTimeout(() => { if ((rajadaL.bloco || rajadaL.n >= 4) && leitura.value.trim()) finalizarLeitura(); }, PAUSA);
});
leitura.addEventListener("keydown", (ev) => { if (ev.key === "Enter") { ev.preventDefault(); finalizarLeitura(); } });
// Leitura que caiu num campo de digitação: tira de lá e processa como leitura
function leituraNoCampo(el, dado, base) { clearTimeout(el._t); el.value = base; el.dataset.antes = base; delete el.dataset.pendente; rajada = { el: null, n: 0 }; if (dado) processarLeitura(dado); }
document.addEventListener("input", (ev) => {
  const el = ev.target;
  if (!ehEditavel(el) || el.dataset.livre) return;
  const antes = el.dataset.antes ?? "";
  if (ev.inputType !== "insertFromPaste" && el.value.length - antes.length >= 6 && el.value.startsWith(antes)) {
    const dado = el.value.slice(antes.length);
    el.dataset.pendente = dado; clearTimeout(el._t);
    el._t = setTimeout(() => { if (el.dataset.pendente === dado) leituraNoCampo(el, dado, antes); }, PAUSA);
    return;
  }
  el.dataset.antes = el.value;
}, true);
let rajada = { el: null, n: 0, ultimo: 0, base: "" };
document.addEventListener("keydown", (ev) => {
  const el = ev.target;
  if (!ehEditavel(el) || ev.target.closest("dialog.pin")) return;
  const t = performance.now();
  if (ev.key.length === 1 && !el.dataset.livre) {
    if (rajada.el !== el || t - rajada.ultimo > RAPIDO) rajada = { el, n: 0, base: el.value };
    rajada.n++; rajada.ultimo = t; clearTimeout(el._t);
    el._t = setTimeout(() => { if (rajada.el === el && rajada.n >= 6) leituraNoCampo(el, el.value.slice(rajada.base.length), rajada.base); }, PAUSA);
    return;
  }
  if (ev.key !== "Enter") return;
  if (el.form && el.closest("dialog")) return;
  ev.preventDefault();
  if (el.dataset.pendente) return leituraNoCampo(el, el.dataset.pendente, el.dataset.antes ?? "");
  rajada = { el: null, n: 0 }; el.dataset.antes = el.value;
  if (el.dataset.enter) telas[telaAtual][el.dataset.enter]?.();
}, true);
function focarLeitura() {
  if (document.querySelector("dialog[open]")) return;
  if (!ehEditavel(document.activeElement) && document.activeElement?.tagName !== "SELECT") leitura.focus({ preventScroll: true });
}
document.addEventListener("click", () => setTimeout(focarLeitura, 0));
document.addEventListener("focusout", () => setTimeout(focarLeitura, 50));

// ---- teclado na tela (o teclado do Android esconde as teclas no MC3300 por causa do teclado físico)
const kb = { el: $("tecladoTela"), alvo: null };
function abrirTeclado(alvo) {
  if (!alvo) return;
  kb.alvo = alvo;
  const numerico = alvo.type === "number" || alvo.inputMode === "numeric";
  const tecla = (t, c = "", r = t) => `<button type="button" data-tecla="${t}" class="${c}">${r}</button>`;
  kb.el.className = numerico ? "numerico" : "";
  kb.el.innerHTML = numerico
    ? ["123", "456", "789"].map((l) => `<div class="linha">${[...l].map((c) => tecla(c)).join("")}</div>`).join("") +
      `<div class="linha">${tecla("FECHAR", "esp", "✕")}${tecla("0")}${tecla("BS", "esp", "⌫")}</div><div class="linha">${tecla("OK", "ok", "OK ↵")}</div>`
    : ["1234567890", "QWERTYUIOP", "ASDFGHJKL", "ZXCVBNM-."].map((l, i) => `<div class="linha">${[...l].map((c) => tecla(c)).join("")}${i === 2 ? tecla("BS", "esp", "⌫") : ""}</div>`).join("") +
      `<div class="linha">${tecla("FECHAR", "esp", "✕")}${tecla("ESPACO", "esp", "espaço").replace("<button", '<button style="flex:4"')}${tecla("OK", "ok", "OK ↵").replace("<button", '<button style="flex:2"')}</div>`;
  (alvo.closest("dialog") || document.body).appendChild(kb.el);
  kb.el.hidden = false; document.body.classList.add("com-teclado");
  setTimeout(() => alvo.scrollIntoView({ block: "center" }), 50);
}
function fecharTeclado() { kb.el.hidden = true; kb.alvo = null; document.body.classList.remove("com-teclado"); document.body.appendChild(kb.el); }
kb.el.addEventListener("pointerdown", (ev) => ev.preventDefault());
kb.el.addEventListener("click", (ev) => {
  ev.stopPropagation();
  const b = ev.target.closest("[data-tecla]"), el = kb.alvo;
  if (!b || !el) return;
  const t = b.dataset.tecla;
  el.focus({ preventScroll: true });
  if (t === "FECHAR") return fecharTeclado();
  if (t === "OK") { fecharTeclado(); if (el.dataset.enter) telas[telaAtual][el.dataset.enter]?.(); else if (el.form) el.form.requestSubmit(); return; }
  const ini = el.selectionStart ?? el.value.length, fim = el.selectionEnd ?? el.value.length;
  if (t === "BS") el.setRangeText("", ini === fim && ini > 0 ? ini - 1 : ini, fim, "end");
  else el.setRangeText(t === "ESPACO" ? " " : t, ini, fim, "end");
  el.dataset.antes = el.value;
  el.dispatchEvent(new Event("input", { bubbles: true }));
});
document.addEventListener("click", (ev) => {
  if (ev.target.closest("#tecladoTela, #teclado")) return;
  if (cfg.teclado && ehEditavel(ev.target) && ev.target.type !== "range") abrirTeclado(ev.target);

}, true);

$("teclado").addEventListener("click", (ev) => {

  rfid(epc) {
    if (ehNfc(epc)) return msg("Etiqueta NFC não é gravada aqui: a gravação é das etiquetas RFID (UHF)", "alerta");
    if (this.proxima && !this.gravando) this.gravar($("goBt"));
  },
  async resultado(r) {
    this.gravando = false;
    if (!r.ok) { bipe("erro"); msg(r.mensagem, "erro", false); this.desenhar(); return; }
    await executar(null, async () => {
      await api("POST", "/api/etiquetas/gravacao", { epc: r.novo, antigo: r.antigo });
      bipe("ok"); msg("✓ Gravada " + r.novo.slice(-8), "ok", false);
      await this.proximo();
    });
  },
};

// ======================================================================= Tela genérica: lê etiquetas, confere e confirma
// Usada por Vincular, Entrada, Baixa e Transferir.
function telaOperacao(def) {
  return {
    titulo: def.titulo, potencia: def.potencia, gatilho: def.gatilho,
    abrir() {
      this.itens = new Map();
      this.j = juntador((l) => this.conferir(l));
      this.estado = def.inicio ? def.inicio() : {};
      this.desenhar();
    },
    desenhar() {
      const lista = [...this.itens.values()], ok = lista.filter((t) => t.ok);
      tela.innerHTML = `<div class="card">${def.campos(this.estado)}</div>
        ${def.topo ? def.topo(this.estado) : ""}
        ${lista.length ? "" : `<div class="dica">${def.dica}</div>`}
        <div class="card"><h2>${def.rotuloLista || "Lidas"} <span class="dir"><span class="contador" style="color:var(--sucesso)">${ok.length}</span>
          ${lista.length > ok.length ? `<span class="selo perigo">${lista.length - ok.length} recusada(s)</span>` : ""}</span></h2>
          <ul class="lista">${lista.map((t) => `<li class="${t.ok ? "ok" : "erro"}"><div class="info">${nomeProduto(t)}<div class="mono fraco">${mostraEpc(t.epc)}</div>
            ${t.ok ? (t.local ? `<span class="fraco">${esc(t.local)}</span> ` : "") + seloSit(t.status) : esc(t.motivo)}</div>
            <button class="x" data-acao="tirar" data-valor="${esc(t.epc)}">✕</button></li>`).join("")}</ul></div>
        <div class="botoes"><button class="b" data-acao="limpar">Limpar</button>
          <button class="b ${def.perigo ? "perigo" : "primario"}" data-acao="confirmar" ${ok.length ? "" : "disabled"}>${def.botao} (${ok.length})</button></div>`;
      def.depois?.(this.estado, this);
    },
    rfid(epc) {
      const erro = def.pronto?.(this.estado);
      if (erro) return msg(erro, "alerta");
      this.j.add(epc);
    },
    codigo(c) { def.codigo ? def.codigo(c, this.estado, this) : msg("Código " + c + " não usado aqui", "info"); },
    async conferir(epcs) {
      try {
        const r = await api("POST", "/api/etiquetas/verificar", { epcs, operacao: def.operacao, ...def.params(this.estado) });
        r.forEach((t) => this.itens.set(t.epc, t));
        if (telaAtual !== def.id) return;
        bipe(r.some((t) => !t.ok) ? "erro" : "ok");
        this.desenhar();
      } catch (e) { epcs.forEach((x) => this.j.esquecer(x)); msg(e.message, "erro"); }
    },
    reconferir() { const e = [...this.itens.keys()]; this.itens.clear(); this.j.esquecer(); e.forEach((x) => this.j.vistas.add(x)); if (e.length) this.conferir(e); else this.desenhar(); },
    tirar(_b, epc) { this.itens.delete(epc); this.j.esquecer(epc); this.desenhar(); },
    limpar() { this.itens.clear(); this.j.esquecer(); this.desenhar(); },
    async confirmar(b) {
      const epcs = [...this.itens.values()].filter((t) => t.ok).map((t) => t.epc);
      if (def.confirmacao && !(await confirmar(def.titulo, def.confirmacao(epcs.length, this.estado)))) return;
      await executar(b, async () => {
        const r = await api("POST", def.url, { epcs, ...def.corpo(this.estado) });
        msg(`✓ ${def.feito}: ${r.quantidade}` + (r.erros.length ? `\n${r.erros.length} recusada(s): ${r.erros[0].motivo}` : ""), r.erros.length ? "alerta" : "ok");
        this.ultimo = { epcs: r.ok, operacao: def.operacao };
        this.itens.clear(); this.j.esquecer(); this.desenhar();
        def.aposConfirmar?.(this, r);
      });
    },
  };
}

// ======================================================================= LER ETIQUETA (verificação: EPC, chip e memória pelo TID)
const FABRICANTES = { 0x001: "Impinj", 0x002: "Texas Instruments", 0x003: "Alien Technology", 0x004: "Intelleflex", 0x005: "Atmel", 0x006: "NXP",
  0x007: "ST Microelectronics", 0x008: "EP Microelectronics", 0x00A: "Sentech", 0x00B: "EM Microelectronic", 0x00C: "Renesas", 0x00F: "Quanray", 0x010: "Fujitsu", 0x018: "Ceitec" };
const CHIPS = { "001-100": ["Monza 4D", 128, 32], "001-105": ["Monza 4QT", 128, 512], "001-10C": ["Monza 4E", 496, 128], "001-130": ["Monza 5", 128, 32],
  "001-160": ["Monza R6", 96, 0], "001-170": ["Monza R6-P", 128, 64], "001-190": ["M730", 128, 0], "001-191": ["M750", 96, 32],
  "006-810": ["UCODE 7", 128, 0], "006-894": ["UCODE 8", 128, 0], "006-915": ["UCODE 9", 96, 0], "003-412": ["Higgs-3", 480, 512], "003-414": ["Higgs-4", 128, 128], "003-811": ["Higgs-9", 496, 688] };
function chipDoTid(tid) {
  if (!/^E2[0-9A-F]{6}/i.test(tid || "")) return null;
  const mdid = parseInt(tid.slice(2, 5), 16) & 0x1FF, tmn = parseInt(tid.slice(5, 8), 16);
  const chave = mdid.toString(16).toUpperCase().padStart(3, "0") + "-" + tmn.toString(16).toUpperCase().padStart(3, "0");
  const fab = FABRICANTES[mdid] || `fabricante 0x${mdid.toString(16).toUpperCase()}`, c = CHIPS[chave];
  return c ? { nome: `${fab} ${c[0]}`, epcMax: c[1], user: c[2] } : { nome: `${fab}, modelo 0x${tmn.toString(16).toUpperCase().padStart(3, "0")}` };
}

  },

  titulo: "Estação PC",
  abrir() {
    this.apos = null; this.enviadas = new Set(); this.buffer = [];
    tela.innerHTML = `<div class="card" style="text-align:center;margin-top:40px;padding:28px 12px"><div style="font-size:64px;line-height:1.1">🖥️</div>

        <div class="fraco" style="margin-top:8px">Deixe esta tela aberta: o PC manda ler, parar e gravar. O gatilho também lê.</div></div>`;
    try { app?.manterTelaLigada?.(true); } catch {}

  },

  estado(t, ok) { if ($("rmEstado")) { $("rmEstado").textContent = t; $("rmEstado").style.color = ok ? "var(--sucesso)" : ""; } },
  async buscar() {

      if (telaAtual !== "remoto") return;
      if (this.apos === null) { this.apos = r.ultimo; this.estado("✓ Conectado ao PC", true); return; }
      for (const c of r.comandos) { this.apos = c.id; this.executar(c); }
    } catch { this.estado("Sem conexão com o servidor"); } finally { this.buscando = false; }
  },
  executar(c) {
    if (c.acao === "ler") { definirPotencia(c.potencia || 100); try { app?.lerContinuo?.(true); } catch {} this.estado("Lendo (comando do PC)…", true); }
    else if (c.acao === "parar") { try { app?.lerContinuo?.(false); } catch {} this.estado("✓ Conectado ao PC", true); this.evento("parou", {}); }
    else if (c.acao === "limpar") { this.enviadas.clear(); }
    else if (c.acao === "gravar") {
      try { app?.lerContinuo?.(false); } catch {}
      if (!app?.gravarEtiqueta) return this.evento("gravacao", { ok: false, mensagem: "Coletor sem o app TagStock" });
      this.estado("Gravando: encoste o coletor na etiqueta…", true);

  async enviar() {
    this.timerEnvio = null;
    const epcs = this.buffer; this.buffer = [];
    if (epcs.length) try { await api("POST", "/api/remoto/leituras", { epcs }); } catch { epcs.forEach((e) => this.enviadas.delete(e)); }
  },
  codigo(c) { this.evento("codigo", { codigo: c }); },
};

// ======================================================================= CONFIG (PIN 1234)
const SENHA_CONFIG = "1234";
let configLiberada = false, pin = "";
function mostrarPin() { $("pinVisor").textContent = pin ? "•".repeat(pin.length) : "—"; }
function teclaPin(t) {
  if (t === "apagar") pin = pin.slice(0, -1);
  else if (t === "ok") { if (pin === SENHA_CONFIG) { $("dlgSenha").close(); configLiberada = true; telas.config.abrir(); return; } pin = ""; msg("PIN incorreto", "alerta"); }
  else if (pin.length < 8) pin += t;
  mostrarPin();
}
$("pinTeclado").addEventListener("click", (ev) => { const b = ev.target.closest("button"); if (b) teclaPin(b.dataset.t || b.textContent.trim()); });
$("dlgSenha").addEventListener("keydown", (ev) => {
  if (/^[0-9]$/.test(ev.key)) teclaPin(ev.key); else if (ev.key === "Backspace") teclaPin("apagar"); else if (ev.key === "Enter") teclaPin("ok"); else return;
  ev.preventDefault();
});
$("senhaCancelar").addEventListener("click", () => { $("dlgSenha").close(); location.hash = "menu"; });
$("dlgSenha").addEventListener("cancel", (ev) => { ev.preventDefault(); $("dlgSenha").close(); location.hash = "menu"; });
telas.config = {
  titulo: "Config",
  abrir() {
    if (!configLiberada) { tela.innerHTML = ""; pin = ""; mostrarPin(); if (!$("dlgSenha").open) $("dlgSenha").showModal(); return; }
    let volume = cfg.volume;
    try { if (app?.volumeAtual) volume = app.volumeAtual(); } catch {}
    tela.innerHTML = `<div class="card"><h2>Usuário</h2><div>${usuario ? `<b>${esc(usuario.nome)}</b> (${esc(usuario.login)})` : "Ninguém conectado"}</div>
        <div class="fraco">Coletor ${esc(idColetor)}</div>${usuario ? '<div class="botoes"><button class="b" data-acao="sairUsuario">Sair (trocar usuário)</button></div>' : ""}</div>
      <div class="card"><h2>Volume do bipe <span class="dir"><b id="cfVolTxt">${volume}%</b></span></h2>
        <input type="range" id="cfVolume" min="0" max="100" step="10" value="${volume}" style="padding:0"></div>
      <div class="card"><h2>Potência da antena RFID</h2>
        ${[["potLeitura", "Leitura (OF, entrada, expedição, antifurto)"], ["potBaixa", "Baixa e consulta"], ["potInventario", "Inventário"], ["potLocalizar", "Localizar"], ["potGravar", "Gravar / vincular"]].map(([k, nome]) =>
          `<div style="margin:8px 0 4px">${nome} <b style="float:right" id="${k}Txt">${cfg[k]}%</b></div><input type="range" data-pot="${k}" min="10" max="100" step="10" value="${cfg[k]}" style="padding:0">`).join("")}
        <p class="fraco" style="margin:6px 0 0">Menos potência lê só o que está perto (evita pegar peça vizinha).</p></div>
      <div class="card"><h2>Servidor</h2><div>${LOCAL ? "<b>Modo local</b>" : `<b class="mono">${esc(location.origin)}</b>`}</div>
        <div class="botoes" style="margin-top:8px"><button class="b primario" data-acao="procurar">📡 Procurar na rede</button><button class="b" data-acao="digitar">✏️ Digitar</button></div></div>`;
    $("cfVolume").addEventListener("input", () => { cfg.volume = Number($("cfVolume").value); salvarCfg(); $("cfVolTxt").textContent = cfg.volume + "%"; try { app?.volume?.(cfg.volume); } catch {} });
    $("cfVolume").addEventListener("change", () => bipe("ok"));
    tela.querySelectorAll("[data-pot]").forEach((r) => r.addEventListener("input", () => { cfg[r.dataset.pot] = Number(r.value); salvarCfg(); $(r.dataset.pot + "Txt").textContent = r.value + "%"; }));
  },
  sairUsuario() { sair(true); },
  procurar() { try { app?.procurarServidor ? app.procurarServidor() : msg("A busca é feita pelo app do coletor", "info"); } catch {} },
  digitar() { try { app ? app.servidor() : msg("Abra http://IP-DO-PC:8100/m", "info"); } catch {} },
};

// ======================================================================= início
(async () => {
  rodape();
  if (!LOCAL) {
    await status();
    if (token) {
      try { usuario = await api("GET", "/api/eu"); await carregarApoio(); } catch (e) { if (token) msg(e.message, "erro"); }
    }
    setInterval(() => { if (token) carregarApoio().catch(() => {}); }, 60000);
  }
  abrir(location.hash.slice(1) || "menu");
})();
</script>
